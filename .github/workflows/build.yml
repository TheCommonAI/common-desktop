name: Desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_linux:
        description: Also build the experimental Linux AppImage
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Common-Windows-x64
          path: release/*.exe
  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # Seal the final app bundle for testing; this is not Developer ID signing.
      - run: npm run dist:mac -- -c.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify signatures inside both Mac disk images
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            mount_dir="$RUNNER_TEMP/common-verify-$arch"
            mkdir -p "$mount_dir"
            hdiutil attach "release/Common-0.1.0-mac-$arch.dmg" -readonly -nobrowse -mountpoint "$mount_dir"
            trap 'hdiutil detach "$mount_dir" || true' EXIT
            codesign --verify --deep --strict --verbose=2 "$mount_dir/Common.app"
            codesign --display --verbose=2 "$mount_dir/Common.app"
            hdiutil detach "$mount_dir"
            trap - EXIT
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Common-macOS
          path: |
            release/*.dmg
            release/*.zip
  linux:
    if: github.event_name == 'workflow_dispatch' && inputs.include_linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Common-Linux-experimental
          path: release/*.AppImage
