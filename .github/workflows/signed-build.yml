name: Signed release candidate
# A place for a trusted build to exist, and nothing more. **This has never run.**
#
# `build.yml` ships ad-hoc signed Mac apps and unsigned Windows installers, because
# there is no certificate. That is survivable — the updater verifies *our* tarball
# signature, which is a separate mechanism, and it works today — but Gatekeeper and
# SmartScreen know nothing about it and may still object to a replaced bundle on the
# next launch. A Developer ID certificate and an Apple notarisation key are the only
# real fix, and this is where they would go.
#
# To make it run, three things have to exist first, and none of them do:
#
#   1. The `signed-releases` environment. Referencing an environment that does not
#      exist fails the job before the first step.
#   2. The secrets below. All are absent.
#   3. For Windows, a code-signing certificate imported into the runner's store —
#      Tauri signs with `bundle.windows.certificateThumbprint`, so the workflow reads
#      the thumbprint off the imported certificate rather than naming it in config.
#
# Until then, dispatching this will fail, and it is meant to: a signed build that
# quietly produces an unsigned artifact is worse than one that refuses to start.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    environment: signed-releases
    env:
      # The updater's own key, which every release needs whatever the platform
      # signing says: without it `createUpdaterArtifacts` fails the build.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Windows. A base64 `.pfx` and its password, imported below.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CSC_LINK }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      # macOS. Tauri reads these names directly; `APPLE_PASSWORD` is an app-specific
      # password, not the account password.
      APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import the Windows certificate and take its thumbprint
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $cert = New-Object -TypeName System.Security.Cryptography.X509Certificates.X509Certificate2 `
            -ArgumentList $bytes, $env:WINDOWS_CERTIFICATE_PASSWORD, 'PersistKeySet'
          $store = New-Object -TypeName System.Security.Cryptography.X509Certificates.X509Store `
            -ArgumentList 'My', 'CurrentUser'
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_WINDOWS_THUMBPRINT=$($cert.Thumbprint)"

      - name: Build signed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The config goes in a file rather than on the command line: it is JSON
            # full of quotes, and it has to survive npm, node and a Windows argument
            # parser on the way to the bundler.
            cat > "$RUNNER_TEMP/windows-sign.json" <<JSON
          {"bundle":{"windows":{"certificateThumbprint":"$TAURI_WINDOWS_THUMBPRINT","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}
          JSON
            npm run tauri build -- --bundles nsis --config "$RUNNER_TEMP/windows-sign.json"
          else
            npm run tauri build
          fi

      - name: Verify Windows Authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "Installer signature invalid: $($_.Name)" }
          }

      - name: Verify the notarisation ticket is stapled
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for file in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            xcrun stapler validate "$file"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig
