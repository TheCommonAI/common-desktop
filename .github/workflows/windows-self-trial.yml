name: Windows self-trial
# The app set itself up on a real Windows machine, start to finish, photographed.
#
# ── What this answers ─────────────────────────────────────────────────────────
#
# A friend's Windows machine reached the network — its node was listed in
# `/peers`, its join log ended "you are live" — and the app told them "It took too
# long to answer." No unit test can see that bug: the evidence is a screen, and
# the failure is a screen that says the wrong thing. This runs the whole setup
# flow against the real CLI and the real gateway and keeps a picture of every
# step, so the answer to "does it work on Windows?" is a folder of screenshots
# rather than an opinion.
#
# It is dispatch-only, and deliberately its own file. `build.yml` is what
# `publish-preview.yml` counts jobs in to decide whether a release may go out;
# adding a job there would change that count and make a trial a release gate.
# Nothing here runs on a push or a pull request.
#
# ── What makes it go red ──────────────────────────────────────────────────────
#
# A screen that never renders, a step that never advances, an error ending, or a
# frame that is a single flat colour. It does *not* go red on "You're registered."
# — a GitHub runner is a cloud IP behind a quick tunnel, and the gateway's health
# probe crossing into it is exactly the hop that failed for the friend. Failing on
# someone else's unreachable tunnel would make this useless as a signal.
on:
  workflow_dispatch:
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    # The Rust build, a multi-gigabyte model download, a test prompt on four CPU
    # cores and the gateway's own confirmation poll all live in here.
    #
    # This sits above the sum of the per-step ceilings below (30+15+75=120)
    # on purpose. Every step that can hang carries its own ceiling, so a hang is
    # reported against the step that hung rather than as an opaque job timeout —
    # which is exactly what the first run of this workflow cost us 23 minutes and
    # a cancelled run to learn. This one is only the outer envelope.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # `install.ps1` shells out to `python` and bails if it is not on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── the app, with a devtools port ───────────────────────────────────────
      #
      # Two things about this config are load-bearing and neither is obvious.
      #
      # `additionalBrowserArgs` **replaces** wry's defaults rather than adding to
      # them, so the three `--disable-features` are restated — drop them and the
      # app ships a webview with WebView2's own context menus and SmartScreen
      # filter turned back on.
      #
      # `app.windows` is **restated whole** because Tauri merges configs with
      # `json_patch`, which merges objects per key and replaces arrays wholesale.
      # A partial window object would silently drop `title`, `width`, `height`,
      # `backgroundColor`, `titleBarStyle` and `hiddenTitle`. **If `tauri.conf.json`
      # gains a window key, it has to be added here too.**
      #
      # The rest is what makes a window on a runner drivable and photographable:
      # the debugging port, `--remote-allow-origins` because Chrome 111 and later
      # answer a devtools socket with an unlisted `Origin` with a 403, and the two
      # backgrounding flags so a session with nothing on the glass still renders.
      - name: Build the app with a devtools port open
        shell: pwsh
        # A cold build is ~20 minutes; this is cache-warm at ~4. If it is not done
        # by here it is not going to be, and the job's 90 minutes would be spent
        # finding that out the slow way.
        timeout-minutes: 30
        run: |
          $config = @'
          {
            "bundle": { "createUpdaterArtifacts": false },
            "app": {
              "windows": [
                {
                  "title": "Common",
                  "width": 800,
                  "height": 600,
                  "backgroundColor": "#292928",
                  "titleBarStyle": "Transparent",
                  "hiddenTitle": true,
                  "additionalBrowserArgs": "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222 --remote-allow-origins=* --disable-backgrounding-occluded-windows --disable-renderer-backgrounding --force-device-scale-factor=1"
                }
              ]
            }
          }
          '@
          $config | Out-File -Encoding utf8 trial-config.json
          npm run tauri build -- --bundles nsis --config trial-config.json

      # ── the real CLI, from the network's own installer ──────────────────────
      #
      # Downloaded to a file and run, rather than piped into `iex`: same trust,
      # but the log shows what actually ran.
      - name: Install the network's CLI
        shell: pwsh
        # The ceiling on this one is not decorative: `install.ps1` is the network's
        # own script and it does its own fetching, so the driver here cannot put a
        # timeout inside it. The step timeout is the only thing that bounds it.
        timeout-minutes: 15
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $script = "$env:RUNNER_TEMP\common-install.ps1"
          curl.exe -L --fail --no-progress-meter --retry 3 --max-time 300 -o $script 'https://commonai.com.au/install.ps1'
          if ($LASTEXITCODE -ne 0) { throw "downloading install.ps1 failed (curl exit $LASTEXITCODE)" }
          & $script

          # `HOME` is deliberately left alone. The CLI installs into the default
          # home, and that is exactly where `common_bin()` looks first; moving it
          # would put the binary, the identity and the weights in three different
          # places and break all three at once.
          $bin = "$env:USERPROFILE\.common-network\bin"
          $common = "$bin\common.cmd"
          if (-not (Test-Path $common)) { throw "the CLI installer did not write $common" }
          Get-ChildItem $bin | Select-Object -ExpandProperty Name
          & $common --no-color --no-update --version

      # ── the app, started and driven in one step ───────────────────────────────
      #
      # There is deliberately no "launch the app" step above this one. There was,
      # and it is what broke run three: it started the app, confirmed the devtools
      # port answered, and ended — and the app died five seconds later with the
      # step's shell, because the runner puts each step in a Windows job object and
      # children inherit membership. A process that has to outlive a step cannot be
      # started by that step. `launch()` in the driver has the timestamps.
      #
      # The driver finds the binary by globbing, starts it, waits for the port, and
      # reports the exit code and everything the app printed if it never gets there.
      #
      # The driver bounds every wait it makes (the launch is allowed a minute, the
      # download 30, the join 15, everything else 2). This is the backstop for the
      # case the driver's own accounting misses — a `Runtime.evaluate` that never
      # returns because the page is wedged.
      - name: Drive the setup flow
        shell: pwsh
        timeout-minutes: 75
        run: |
          New-Item -ItemType Directory -Force -Path trial-shots | Out-Null
          node scripts/trial/drive.mjs 2>&1 | Tee-Object -FilePath trial-shots\driver.log
          $code = $LASTEXITCODE
          Get-Content trial-shots\driver.log |
            Select-String -Pattern 'TRIAL RESULT|TRIAL FAILED|TRIAL SHOTS|join:' |
            ForEach-Object { $_.Line } |
            Add-Content $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { exit $code }

      # ── whatever happened, keep the record and tidy up ──────────────────────
      - name: Collect what the app left behind
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trial-shots | Out-Null
          $dir = "$env:USERPROFILE\.common-network"
          # The app's own account of the join — the file the friend could never
          # send us. `identity.json` sits beside it and holds a bearer node token,
          # so it is deliberately not copied and never uploaded.
          if (Test-Path "$dir\join.log") { Copy-Item "$dir\join.log" trial-shots\join.log }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-self-trial
          # The app's own stdout and stderr are written into `trial-shots/` by the
          # driver, which now owns the process, so the glob below already covers them.
          path: trial-shots/**
          if-no-files-found: warn

      # A run that registers a real node on the production network leaves it there
      # otherwise, and the runner is destroyed the moment the job ends.
      - name: Leave the network
        if: always()
        shell: pwsh
        run: |
          $common = "$env:USERPROFILE\.common-network\bin\common.cmd"
          if (Test-Path $common) { & $common --no-color --no-update leave }
