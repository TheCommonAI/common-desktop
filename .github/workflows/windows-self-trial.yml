name: Windows self-trial
# The app set itself up on a real Windows machine, start to finish, photographed.
#
# ── What this answers ─────────────────────────────────────────────────────────
#
# A friend's Windows machine reached the network — its node was listed in
# `/peers`, its join log ended "you are live" — and the app told them "It took too
# long to answer." No unit test can see that bug: the evidence is a screen, and
# the failure is a screen that says the wrong thing. This runs the whole setup
# flow against the real CLI and the real gateway and keeps a picture of every
# step, so the answer to "does it work on Windows?" is a folder of screenshots
# rather than an opinion.
#
# It is dispatch-only, and deliberately its own file. `build.yml` is what
# `publish-preview.yml` counts jobs in to decide whether a release may go out;
# adding a job there would change that count and make a trial a release gate.
# Nothing here runs on a push or a pull request.
#
# ── What makes it go red ──────────────────────────────────────────────────────
#
# A screen that never renders, a step that never advances, an error ending, or a
# frame that is a single flat colour. It does *not* go red on "You're registered."
# — a GitHub runner is a cloud IP behind a quick tunnel, and the gateway's health
# probe crossing into it is exactly the hop that failed for the friend. Failing on
# someone else's unreachable tunnel would make this useless as a signal.
on:
  workflow_dispatch:
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The page in the webview fetches `/api/tags` and `/api/ps` straight from Ollama,
  # and its origin is `http://tauri.localhost` — not one Ollama allows by default.
  # Without this both fetches are refused, which the app survives but which turns
  # the byte count and the loading phase into guesses. Job-level, so the daemon
  # started below inherits it.
  OLLAMA_ORIGINS: http://tauri.localhost,http://localhost,http://127.0.0.1

jobs:
  windows:
    runs-on: windows-latest
    # The Rust build, a multi-gigabyte model download, a test prompt on four CPU
    # cores and the gateway's own confirmation poll all live in here.
    #
    # This sits above the sum of the per-step ceilings below (30+25+15+5+60=135)
    # on purpose. Every step that can hang carries its own ceiling, so a hang is
    # reported against the step that hung rather than as an opaque job timeout —
    # which is exactly what the first run of this workflow cost us 23 minutes and
    # a cancelled run to learn. This one is only the outer envelope.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # `install.ps1` shells out to `python` and bails if it is not on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── the app, with a devtools port ───────────────────────────────────────
      #
      # Two things about this config are load-bearing and neither is obvious.
      #
      # `additionalBrowserArgs` **replaces** wry's defaults rather than adding to
      # them, so the three `--disable-features` are restated — drop them and the
      # app ships a webview with WebView2's own context menus and SmartScreen
      # filter turned back on.
      #
      # `app.windows` is **restated whole** because Tauri merges configs with
      # `json_patch`, which merges objects per key and replaces arrays wholesale.
      # A partial window object would silently drop `title`, `width`, `height`,
      # `backgroundColor`, `titleBarStyle` and `hiddenTitle`. **If `tauri.conf.json`
      # gains a window key, it has to be added here too.**
      #
      # The rest is what makes a window on a runner drivable and photographable:
      # the debugging port, `--remote-allow-origins` because Chrome 111 and later
      # answer a devtools socket with an unlisted `Origin` with a 403, and the two
      # backgrounding flags so a session with nothing on the glass still renders.
      - name: Build the app with a devtools port open
        shell: pwsh
        # A cold build is ~20 minutes; this is cache-warm at ~4. If it is not done
        # by here it is not going to be, and the job's 90 minutes would be spent
        # finding that out the slow way.
        timeout-minutes: 30
        run: |
          $config = @'
          {
            "bundle": { "createUpdaterArtifacts": false },
            "app": {
              "windows": [
                {
                  "title": "Common",
                  "width": 800,
                  "height": 600,
                  "backgroundColor": "#292928",
                  "titleBarStyle": "Transparent",
                  "hiddenTitle": true,
                  "additionalBrowserArgs": "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222 --remote-allow-origins=* --disable-backgrounding-occluded-windows --disable-renderer-backgrounding --force-device-scale-factor=1"
                }
              ]
            }
          }
          '@
          $config | Out-File -Encoding utf8 trial-config.json
          npm run tauri build -- --bundles nsis --config trial-config.json

      # ── Ollama, before the CLI ───────────────────────────────────────────────
      #
      # The order is the point. `install.ps1` only fetches `cloudflared.exe` if it
      # finds `ollama` on PATH at the moment it runs, and `common join` dies
      # without cloudflared. Installing Ollama second produces an install that
      # looks complete and cannot join anything.
      # Both halves of this are bounded on purpose. `Invoke-WebRequest` buffers the
      # whole response and carries no timeout of its own, and `Start-Process -Wait`
      # on an NSIS installer waits forever if the installer decides to put up a
      # window — which on a runner with no interactive desktop it cannot draw and
      # will not dismiss. The first run of this workflow sat on this step for 23
      # minutes making no progress, which is a hang wearing a slow download's
      # clothes. `--max-time` bounds the transfer, `--retry` rides out a blip, and
      # `WaitForExit(ms)` bounds the install.
      - name: Install Ollama
        shell: pwsh
        timeout-minutes: 25
        run: |
          $setup = "$env:RUNNER_TEMP\OllamaSetup.exe"
          curl.exe -L --fail --no-progress-meter --retry 3 --max-time 900 -o $setup 'https://ollama.com/download/OllamaSetup.exe'
          if ($LASTEXITCODE -ne 0) { throw "downloading OllamaSetup.exe failed (curl exit $LASTEXITCODE)" }
          Write-Host "downloaded OllamaSetup.exe: $((Get-Item $setup).Length) bytes"

          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/NORESTART' -PassThru
          if (-not $install.WaitForExit(600000)) { $install.Kill(); throw 'OllamaSetup.exe did not finish within 10 minutes' }
          Write-Host "OllamaSetup.exe exit code: $($install.ExitCode)"

          # The installer edits the registry's PATH; this process started before
          # that, so it refreshes its own copy rather than hoping.
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          if (-not (Get-Command ollama -ErrorAction SilentlyContinue)) { throw 'ollama is not on PATH after installing it' }
          ollama --version
          Start-Process -FilePath 'ollama' -ArgumentList 'serve' -WindowStyle Hidden
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline) {
            try { Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/version' -TimeoutSec 3 | Out-Null; break }
            catch { Start-Sleep -Seconds 2 }
          }
          Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/version' | ConvertTo-Json -Compress

      # ── the real CLI, from the network's own installer ──────────────────────
      #
      # Downloaded to a file and run, rather than piped into `iex`: same trust,
      # but the log shows what actually ran.
      - name: Install the network's CLI
        shell: pwsh
        # The ceiling on this one is not decorative: `install.ps1` is the network's
        # own script and it does its own fetching, so the driver here cannot put a
        # timeout inside it. The step timeout is the only thing that bounds it.
        timeout-minutes: 15
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $script = "$env:RUNNER_TEMP\common-install.ps1"
          curl.exe -L --fail --no-progress-meter --retry 3 --max-time 300 -o $script 'https://commonai.com.au/install.ps1'
          if ($LASTEXITCODE -ne 0) { throw "downloading install.ps1 failed (curl exit $LASTEXITCODE)" }
          & $script

          # `HOME` is deliberately left alone. The CLI installs into the default
          # home, and that is exactly where `common_bin()` looks first; moving it
          # would put the binary, the identity and the weights in three different
          # places and break all three at once.
          $bin = "$env:USERPROFILE\.common-network\bin"
          $common = "$bin\common.cmd"
          if (-not (Test-Path $common)) { throw "the CLI installer did not write $common" }
          # The one assertion that proves the ordering above was right.
          if (-not (Test-Path "$bin\cloudflared.exe")) { throw "cloudflared is missing — install.ps1 did not see Ollama" }
          Get-ChildItem $bin | Select-Object -ExpandProperty Name
          & $common --no-color --no-update --version

      # ── the app ──────────────────────────────────────────────────────────────
      #
      # The binary is found rather than named: Tauri v2 stopped renaming it to
      # `productName`, so it is `common-desktop.exe`, and hardcoding either guess
      # is a coin flip that lands on "file not found" rather than on a bug.
      - name: Launch the app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = @(Get-ChildItem -Path 'src-tauri\target\release' -Filter '*.exe' -File)
          if ($exe.Count -ne 1) { throw "expected exactly one exe in src-tauri/target/release, found $($exe.Count): $($exe.Name -join ', ')" }
          Write-Host "app binary: $($exe[0].FullName)"
          $out = "$env:RUNNER_TEMP\app-stdout.log"
          $err = "$env:RUNNER_TEMP\app-stderr.log"
          $app = Start-Process -FilePath $exe[0].FullName -WorkingDirectory $exe[0].DirectoryName -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "app pid: $($app.Id)"

          # Ask the app, here, whether it is alive — do not leave this question to
          # the driver. The first run of this workflow ended with the driver
          # reporting "the app exited before its devtools port opened" at 0.0s, and
          # nothing else: no stdout, no stderr, no screenshots. That is consistent
          # with two very different stories, and the timestamps cannot tell them
          # apart — the app dying on its own in the five seconds before the driver
          # started, or the driver's own liveness probe (a `process.kill(pid, 0)`
          # whose Windows behaviour is not the POSIX behaviour) being wrong and
          # killing it. A Process object here actually knows, and the exit code
          # names the cause: 0xC0000135 is a missing DLL, 0xC0000005 an access
          # violation, 0xC0000142 a DLL that failed to initialise, 0 a deliberate
          # exit.
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            $code = '{0:X8}' -f $app.ExitCode
            throw "the app exited within 10s of launch — exit code 0x$code. stdout: $(if (Test-Path $out) { (Get-Content $out -Raw) } else { '<none>' }) stderr: $(if (Test-Path $err) { (Get-Content $err -Raw) } else { '<none>' })"
          }
          Write-Host "app is still running 10s after launch"

          # And whether the devtools port the driver needs actually opened. If the
          # app is alive and this never answers, `additionalBrowserArgs` did not
          # take effect and that is a different bug with a different fix.
          $deadline = (Get-Date).AddSeconds(40)
          $up = $false
          while ((Get-Date) -lt $deadline) {
            try { Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json/version' -TimeoutSec 3 | Out-Null; $up = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $up) { throw 'the app is running but its devtools port never opened — additionalBrowserArgs did not take effect' }
          Write-Host 'devtools port is up'

          "TRIAL_PID=$($app.Id)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TRIAL_DEVTOOLS=http://127.0.0.1:9222" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TRIAL_SHOTS=trial-shots" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TRIAL_APP_LOG=$err" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The driver bounds every wait it makes (the download is allowed 30 minutes,
      # the join 15, everything else 2). This is the backstop for the case the
      # driver's own accounting misses — a `Runtime.evaluate` that never returns
      # because the page is wedged.
      - name: Drive the setup flow
        shell: pwsh
        timeout-minutes: 60
        run: |
          New-Item -ItemType Directory -Force -Path trial-shots | Out-Null
          node scripts/trial/drive.mjs 2>&1 | Tee-Object -FilePath trial-shots\driver.log
          $code = $LASTEXITCODE
          Get-Content trial-shots\driver.log |
            Select-String -Pattern 'TRIAL RESULT|TRIAL FAILED|TRIAL SHOTS|join:' |
            ForEach-Object { $_.Line } |
            Add-Content $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { exit $code }

      # ── whatever happened, keep the record and tidy up ──────────────────────
      - name: Collect what the app left behind
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trial-shots | Out-Null
          $dir = "$env:USERPROFILE\.common-network"
          # The app's own account of the join — the file the friend could never
          # send us. `identity.json` sits beside it and holds a bearer node token,
          # so it is deliberately not copied and never uploaded.
          if (Test-Path "$dir\join.log") { Copy-Item "$dir\join.log" trial-shots\join.log }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-self-trial
          path: |
            trial-shots/**
            ${{ runner.temp }}/app-stdout.log
            ${{ runner.temp }}/app-stderr.log
          if-no-files-found: warn

      # A run that registers a real node on the production network leaves it there
      # otherwise, and the runner is destroyed the moment the job ends.
      - name: Leave the network
        if: always()
        shell: pwsh
        run: |
          $common = "$env:USERPROFILE\.common-network\bin\common.cmd"
          if (Test-Path $common) { & $common --no-color --no-update leave }
