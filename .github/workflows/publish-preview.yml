name: Publish desktop release
# Dispatch only. Editing this file used to publish a release: the push trigger fired
# on any change to it and the inputs defaulted to a fixed run ID and tag, so a change
# to how releases are made shipped one as a side effect, from whatever build that
# stale ID pointed at. Both inputs are typed by the person publishing, every time.
#
# The filename still says "preview" because that is what people type to find it. What
# it produces is a full release, and since 0.2.0 it carries the update manifest as
# well as the installers.
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Desktop builds run ID from main
        required: true
      tag:
        description: Release tag, v<version> — must agree with the version files
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the build this release is cut from
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          # A full semver tag and nothing else. A prerelease tag here would break the
          # website and the updater at the same instant: both resolve through
          # /releases/latest/, which skips prereleases.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run watch "$BUILD_RUN" --exit-status --interval 10
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg repo "$GH_REPO" '
            .conclusion == "success" and .status == "completed" and
            .event == "push" and .head_branch == "main" and
            .path == ".github/workflows/build.yml" and
            .repository.full_name == $repo and .head_repository.full_name == $repo
          ' run.json
          echo "sha=$(jq -r .head_sha run.json)" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs" > jobs.json

          # `verify` and `windows` have one job each, named exactly that. `macos` does
          # not: it is a matrix, so GitHub appends the matrix parameters and the job is
          # called `macos (aarch64-apple-darwin, Common-macOS-arm64)`. An equality test
          # against the bare name can therefore never succeed, and this check — which
          # gates the release — would fail on every run while looking like it was
          # working. So a name matches either as itself or as itself followed by the
          # matrix parameters, and every job that is not `linux` must have concluded
          # successfully. `linux` is dispatch-only, so on a push to main it is always
          # `skipped`, and it is building an installer that this workflow does not
          # publish; it is excluded rather than required.
          jq -e '
            [ .jobs[] | select(.name != "linux") ] as $real
            | ($real | length) >= 4
              and all($real[]; .conclusion == "success")
              and all(["verify", "windows", "macos"][];
                  . as $want | any($real[]; .name == $want or (.name | startswith($want + " "))))
          ' jobs.json

      # Checked out at the commit that was built, not at whatever main has moved on
      # to since. The scripts and the version files used below are therefore the ones
      # that produced these artifacts, which is the only reading under which checking
      # the tag against them means anything.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Check the tag against the source it was built from
        id: version
        shell: bash
        run: node scripts/check-version.mjs "$RELEASE_TAG"

      - name: Download the tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" -n Common-Windows-x64 -D artifacts/windows
          gh run download "$BUILD_RUN" -n Common-macOS-arm64 -D artifacts/mac-arm64
          gh run download "$BUILD_RUN" -n Common-macOS-x64   -D artifacts/mac-x64

      - name: Rename to the names the website links to
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release

          # `upload-artifact@v4` keeps each artifact's tree relative to the least
          # common ancestor of the paths its job uploaded — and the macOS job uploads
          # from two directories, `bundle/dmg/` and `bundle/macos/`. So what arrives
          # here is nested, not flat:
          #
          #     dmg/Common_0.2.0_aarch64.dmg
          #     macos/Common.app.tar.gz
          #
          # That is observed rather than assumed: it is the tree `gh run download -n
          # Common-macOS-arm64` actually produced, and under the one-level globs this
          # step used to carry it matched nothing, which would have aborted the first
          # release ever made. So every file is looked for by name at whatever depth
          # it sits — which is also what lets the one script serve a signed run (the
          # `macos/` directory there as well) and an unsigned one (the `dmg/`
          # directory alone).
          one() {
            local found n
            found=$(find "$1" -type f -name "$2")
            n=$(find "$1" -type f -name "$2" | wc -l | tr -d ' ')
            if [[ "$n" -ne 1 ]]; then
              echo "expected exactly one $2 under $1, found $n" >&2
              exit 1
            fi
            printf '%s\n' "$found"
          }

          # Tauri emits `Common_0.2.0_x64-setup.exe` and `Common_0.2.0_aarch64.dmg`.
          # The website links at fixed, version-less names from pages that are not in
          # this repository, so they are renamed here and here only.
          exe=$(one artifacts/windows '*.exe')
          [[ -f "$exe.sig" ]] || { echo "the Windows build was not signed: $exe.sig is missing"; exit 1; }
          mv "$exe" release/Common-win-x64.exe
          mv "$exe.sig" release/Common-win-x64.exe.sig

          arm=$(one artifacts/mac-arm64 '*.dmg')
          x64=$(one artifacts/mac-x64 '*.dmg')
          mv "$arm" release/Common-mac-arm64.dmg
          mv "$x64" release/Common-mac-x64.dmg

          # Both macOS architectures emit a file called `Common.app.tar.gz` — in their
          # own target directories. They are the update payloads, and one tarball
          # cannot serve both, so they are renamed apart and named in the manifest
          # under their own keys.
          while IFS=: read -r dir arch; do
            tar=$(one "artifacts/$dir" 'Common.app.tar.gz')
            [[ -f "$tar.sig" ]] || { echo "the $dir update payload was not signed: $tar.sig is missing"; exit 1; }
            mv "$tar" "release/Common_${VERSION}_${arch}.app.tar.gz"
            mv "$tar.sig" "release/Common_${VERSION}_${arch}.app.tar.gz.sig"
          done <<< $'mac-arm64:aarch64\nmac-x64:x64'

      - name: Check the installers are whole, then hash them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          folder = pathlib.Path("release")
          files = sorted(p for p in folder.iterdir() if p.suffix in {".exe", ".dmg"})
          assert sum(p.suffix == ".exe" for p in files) == 1, "Expected one Windows installer"
          assert sum(p.suffix == ".dmg" for p in files) == 2, "Expected both Mac architectures"
          assert any("-arm64.dmg" in p.name for p in files)
          assert any("-x64.dmg" in p.name for p in files)
          lines = []
          for p in files:
              assert p.stat().st_size > 1_000_000, f"Truncated installer: {p.name}"
              with p.open("rb") as f:
                  if p.suffix == ".exe":
                      assert f.read(2) == b"MZ", "Invalid Windows executable"
                  else:
                      f.seek(-512, 2)
                      assert f.read(4) == b"koly", "Invalid DMG trailer"
              lines.append(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name)
          (folder / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      # `release-notes.md` is cut from `release-notes.json` by the generator, which
      # also writes the app's in-app card from the same file — so the release page
      # and the card cannot say different things. The heredoc that used to be here
      # was boilerplate, identical for every 0.2.x and with no per-version content.
      # The build-run line is the one thing that is a fact about *this* run rather
      # than about the release, so it is still appended here, not in the source.
      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/make-notes.mjs notes "$VERSION" release-notes.md
          printf '\nBuilt from commit %s in [native build run](https://github.com/%s/actions/runs/%s).\n' \
            "${{ steps.source.outputs.sha }}" "$GH_REPO" "$BUILD_RUN" >> release-notes.md

      - name: Assemble the update manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The manifest is what an already-installed copy reads. Its shape is checked
          # in `verify` (src-tauri/tests/manifest.rs) against the plugin's own parser,
          # so a manifest that would silently stop every update from arriving fails
          # before this runs. The notes become the manifest's `notes`.
          node scripts/make-manifest.mjs release "$VERSION" "$RELEASE_TAG" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" release-notes.md
          cat release/latest.json

      - name: Publish as a full release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Published as a full release, not a pre-release: GitHub's
          # /releases/latest/download/<file> form resolves only to the newest
          # NON-prerelease release, and both the website's download links and the
          # updater endpoint use it. The installers are still unsigned on Windows and
          # ad-hoc signed on Mac, and the notes say so. Only the badge is gone.
          gh release create "$RELEASE_TAG" \
            release/Common-win-x64.exe \
            release/Common-mac-arm64.dmg release/Common-mac-x64.dmg \
            release/SHA256SUMS.txt release/latest.json \
            release/Common_${VERSION}_aarch64.app.tar.gz \
            release/Common_${VERSION}_aarch64.app.tar.gz.sig \
            release/Common_${VERSION}_x64.app.tar.gz \
            release/Common_${VERSION}_x64.app.tar.gz.sig \
            --target "${{ steps.source.outputs.sha }}" \
            --title "Common $VERSION" \
            --notes-file release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
