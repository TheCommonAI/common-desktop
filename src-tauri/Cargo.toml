[package]
name = "common-desktop"
version = "0.2.7"
description = "A client for a decentralised network of models running on the machines people already own."
authors = ["Miles Hedrick"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "common_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the menu bar icon; `image-png` is what lets `Image::from_bytes`
# decode the PNG it is handed. Both are non-default Tauri features, so both have
# to be named here or the tray simply will not build.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# The updater. It is driven from the Rust side only — see `update.rs` — so the
# webview never calls it and no capability has to be granted for it. There is no
# `@tauri-apps/plugin-updater` on the npm side for the same reason: the three
# commands in `update.rs` are ordinary app commands, and restarting is
# `AppHandle::restart`, which is in tauri core.
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
